name: 构建 Windows WiseLedger

on:
  push:
    branches:
      - main
      - refactor/split-modules
      - feature/dual-accounting-std
      - feature/print-pdf
  workflow_dispatch:

env:
  APP_VERSION_MAJOR: "2"
  APP_VERSION_MINOR_OFFSET: "56"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 计算版本号
      id: version
      shell: bash
      run: |
        MINOR=$(( ${{ github.run_number }} - ${{ env.APP_VERSION_MINOR_OFFSET }} ))
        # ← 修复：防止 MINOR 为负数
        if [ $MINOR -lt 0 ]; then MINOR=0; fi
        VERSION="PR.${{ env.APP_VERSION_MAJOR }}.${MINOR}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "APP_NAME=WiseLedger_${VERSION}" >> $GITHUB_OUTPUT
        echo "Build version: ${VERSION}"

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 openpyxl pandas xlrd reportlab pyinstaller argon2-cffi cryptography

    - name: 执行 PyInstaller 打包
      run: >
        pyinstaller
        --noconsole
        --onedir
        --name "WiseLedger"
        --icon WiseLedger.ico
        --add-data "WiseLedger.ico;."
        --add-data "arrow_dn.svg;."
        --add-data "pages;pages"
        --add-data "dialogs;dialogs"
        --hidden-import=pages.client
        --hidden-import=pages.voucher
        --hidden-import=pages.account
        --hidden-import=pages.opening
        --hidden-import=pages.settle
        --hidden-import=pages.report
        --hidden-import=pages.audit
        --hidden-import=pages.system
        --hidden-import=dialogs.client_dialogs
        --hidden-import=dialogs.voucher_dialogs
        --hidden-import=dialogs.import_dialogs
        --hidden-import=dialogs.account_dialogs
        --hidden-import=xlrd
        --hidden-import=xlrd.biffh
        --hidden-import=openpyxl.styles
        --hidden-import=openpyxl.utils
        --collect-all argon2
        --collect-all cryptography
        --collect-all keyring
        main.py

    - name: 准备发布目录
      shell: bash
      run: |
        mkdir release
        mv "dist/WiseLedger" "release/智一盈小账"

    - name: 上传程序目录
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.APP_NAME }}
        path: release/
        retention-days: 30