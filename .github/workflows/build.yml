name: 构建 Windows WiseLedger

on:
  push:
    branches:
      - main
      - refactor/split-modules
      - feature/dual-accounting-std
      - feature/print-pdf
      - feat/license-activation
    tags:
      - 'v*.*.*'   # 触发正式发布：打 tag v1.0.0 之类即可
  workflow_dispatch:

env:
  APP_VERSION_MAJOR: "3"
  APP_VERSION_MINOR_OFFSET: "98"

# 允许 GITHUB_TOKEN 创建 Release 和上传 assets
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 计算版本号
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          # Tag 触发 → 正式 release：用 tag 作为版本号（去掉 v 前缀）
          VERSION="${GITHUB_REF#refs/tags/v}"
          IS_RELEASE=true
          echo "Release build: v${VERSION}"
        else
          # 分支触发 → 内部 PR 构建号
          MINOR=$(( ${{ github.run_number }} - ${{ env.APP_VERSION_MINOR_OFFSET }} ))
          if [ $MINOR -lt 0 ]; then MINOR=0; fi
          VERSION="PR.${{ env.APP_VERSION_MAJOR }}.${MINOR}"
          IS_RELEASE=false
          echo "PR build: ${VERSION}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "APP_NAME=WiseLedger_${VERSION}" >> $GITHUB_OUTPUT
        echo "IS_RELEASE=${IS_RELEASE}" >> $GITHUB_OUTPUT

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 openpyxl pandas xlrd reportlab pyinstaller argon2-cffi cryptography keyring cython

    - name: Cython 编译激活模块
      # 把 license.py 编译为 license.pyd 然后删除源 .py，
      # 防止 PyInstaller 把源码也一起打进 exe
      run: python setup_cython.py build_ext --inplace --remove-py

    - name: 执行 PyInstaller 打包
      run: >
        pyinstaller
        --noconsole
        --onedir
        --name "WiseLedger"
        --icon WiseLedger.ico
        --add-data "WiseLedger.ico;."
        --add-data "arrow_dn.svg;."
        --add-data "pages;pages"
        --add-data "dialogs;dialogs"
        --hidden-import=pages.client
        --hidden-import=pages.voucher
        --hidden-import=pages.account
        --hidden-import=pages.opening
        --hidden-import=pages.settle
        --hidden-import=pages.report
        --hidden-import=pages.audit
        --hidden-import=pages.system
        --hidden-import=dialogs.client_dialogs
        --hidden-import=dialogs.voucher_dialogs
        --hidden-import=dialogs.import_dialogs
        --hidden-import=dialogs.account_dialogs
        --hidden-import=xlrd
        --hidden-import=xlrd.biffh
        --hidden-import=openpyxl.styles
        --hidden-import=openpyxl.utils
        --collect-all argon2
        --collect-all cryptography
        --collect-all keyring
        main.py

    - name: 准备发布目录
      shell: bash
      run: |
        mkdir release
        mv "dist/WiseLedger" "release/智一盈小账"

    - name: 上传程序目录
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.APP_NAME }}
        path: release/
        retention-days: 30

    # ─── 以下步骤仅在 tag 触发时执行（正式 release）───
    - name: 打包 release zip
      if: steps.version.outputs.IS_RELEASE == 'true'
      shell: bash
      run: |
        cd release
        7z a -tzip "../${{ steps.version.outputs.APP_NAME }}.zip" "智一盈小账"
        cd ..
        ls -lh "${{ steps.version.outputs.APP_NAME }}.zip"

    - name: 创建 GitHub Release
      if: steps.version.outputs.IS_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.version.outputs.APP_NAME }}.zip
        name: WiseLedger v${{ steps.version.outputs.VERSION }}
        body: |
          ## 智一盈小账 · WiseLedger v${{ steps.version.outputs.VERSION }}

          解压后双击 `WiseLedger.exe` 启动。首次启动需联网验证激活码。

          **系统要求：** Windows 10/11 64位
          **下载：** `${{ steps.version.outputs.APP_NAME }}.zip`

          需要激活码请联系客服。
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}